plugins {
    id "com.android.application"
}

// versión: la pone el workflow (-PvcBuild=N -PvcName=0.6). versionName =
// versión del juego + número de compilación (0.6.N). versionCode es interno
// (no se ve) y crece con cada compilación, así se instala encima sin desinstalar.
def vcBuild = (project.findProperty("vcBuild") ?: "0").toInteger()

android {
    namespace "ar.joaquin.mortalkompapolitico"
    compileSdk 34

    defaultConfig {
        applicationId "ar.joaquin.mortalkompapolitico"
        minSdk 24
        targetSdk 34
        versionCode 100 + vcBuild
        versionName "${(project.findProperty("vcName") ?: "0.6")}.${vcBuild}"
    }

    signingConfigs {
        // MISMA llave que los APK anteriores (build_android/debug.keystore):
        // así Android acepta la actualización encima de la app instalada
        mk {
            storeFile file("../../build_android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.mk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // los assets del juego ya vienen comprimidos (png/mp3/mp4)
    androidResources {
        noCompress += ["png", "jpg", "mp3", "mp4", "wav", "ttf"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
